version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /bridge
      - /ha_app
      - /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    # These version-update limits do not filter or delay security updates.
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    cooldown:
      default-days: 7
    groups:
      npm-patch-minor:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
