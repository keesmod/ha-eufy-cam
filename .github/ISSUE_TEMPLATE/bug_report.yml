name: Bug report
description: Report an installation, snapshot, live-view or existing-recording problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please search existing issues first. Include the bridge version separately from the HACS integration. Do not attach private bridge storage or raw debug logs."
  - type: input
    id: versions
    attributes:
      label: Software versions
      description: Home Assistant, integration AND bridge versions.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Hardware and environment
      description: HomeBase/camera models and firmware; App/Docker and architecture; browser/phone; LAN/VPN/proxy. No serial numbers or addresses.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
      description: Include the exact visible error. For recordings, say whether the same existing clip plays in the Eufy app and whether all live viewers were closed.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant redacted diagnostics (optional)
      description: >-
        For missing devices or failed setup, follow
        https://github.com/keesmod/ha-eufy-cam/blob/main/docs/DISCOVERY_DIAGNOSTICS.md
        and include one complete discovery report, including accepted devices,
        issue rows and connection/error records. Bridge 0.8.5 includes library
        0.12.2. The HA download also requires integration 0.8.5. If that integration
        update is unavailable, use the bridge startup logs. Other failures can
        use a relevant reviewed excerpt. Remove credentials, account details,
        serials, recording paths and private addresses. Never attach raw captures,
        full debug logs, bridge storage or footage.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, tokens, serial numbers, private addresses and identifiable footage.
          required: true
