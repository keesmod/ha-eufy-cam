name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run ruff check custom_components tests
      - run: uv run ruff format --check custom_components tests
      - run: uv run mypy custom_components
      - run: uv run pytest --cov=custom_components.eufy_viewer --cov-report=term-missing --cov-fail-under=95
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  app-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/prepare_ha_app.py
      - run: git diff --exit-code -- ha_app
      - run: docker build -t eufy-viewer-app:test ./ha_app
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
        working-directory: bridge
      - name: Build bridge
        run: npm run build
        working-directory: bridge
      - name: Test bridge
        run: npm test -- --test-timeout=30000
        timeout-minutes: 3
        working-directory: bridge
      - name: Audit bridge dependencies
        run: npm audit --omit=dev
        working-directory: bridge
      - run: docker build -t eufy-viewer-bridge:test ./bridge
      - run: docker run --rm --network none -e EUFY_BRIDGE_TOKEN=00000000000000000000000000000000 -v "${{ github.workspace }}/scripts/container-smoke.mjs:/tmp/smoke.mjs:ro" --entrypoint node eufy-viewer-bridge:test /tmp/smoke.mjs
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
        working-directory: bridge
      - name: Install verified go2rtc for real WebRTC tests
        run: |
          curl --fail --location --retry 3 https://github.com/AlexxIT/go2rtc/releases/download/v1.9.14/go2rtc_linux_amd64 -o "$RUNNER_TEMP/go2rtc"
          echo "32d616af226bd731678ffde328b94cfb94e30339bfefc469cfb76323144615a6  $RUNNER_TEMP/go2rtc" | sha256sum --check
          chmod +x "$RUNNER_TEMP/go2rtc"
          echo "GO2RTC_BINARY=$RUNNER_TEMP/go2rtc" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build && npm test
        working-directory: frontend
