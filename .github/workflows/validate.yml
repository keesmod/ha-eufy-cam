name: Validate
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      manifest_sha256:
        description: Digest of the verified package manifest
        value: ${{ jobs.release-package.outputs.manifest_sha256 }}
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  # A documentation-only pull request into main or branch push skips the
  # build, test and package jobs. main and every release run keep the
  # complete workflow.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a documentation-only change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 scripts/ci_scope.py
  dependency-security:
    uses: ./.github/workflows/dependency-security.yml
  home-assistant-checks:
    uses: ./.github/workflows/home-assistant-checks.yml
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_workflows.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Check versions, release notes, dependency pins and changed components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py check
  home-assistant:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run ruff check custom_components tests
      - run: uv run ruff format --check custom_components tests
      - run: uv run mypy custom_components
      - run: uv run pytest --cov=custom_components.eufy_viewer --cov-report=term-missing --cov-fail-under=95
  app-package:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    # The app's config.json lists amd64 and aarch64, and Supervisor builds the
    # image on the user's machine. Build and start it natively on both.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The store folders are frozen release outputs. Build the candidate app
      # from bridge/ and app/ instead.
      - name: Stage the candidate app build context
        run: python3 scripts/prepare_ha_app.py --stage
      - run: docker build -t eufy-viewer-app:test artifacts/ha_app/eufy_viewer_bridge
      - name: Start the app bootstrap with synthetic options
        run: docker run --rm --network none -v "${{ github.workspace }}/scripts/app-container-smoke.mjs:/tmp/app-smoke.mjs:ro" --entrypoint node eufy-viewer-app:test /tmp/app-smoke.mjs
  bridge:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      # The Ubuntu mirror is sometimes very slow, so apt packages come from
      # earlier runs where possible, see scripts/ci_apt.sh.
      - name: Key the apt package cache
        id: apt
        run: scripts/ci_apt.sh keys bridge
      - name: Restore the apt packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt.outputs.key }}
          restore-keys: |
            ${{ steps.apt.outputs.image }}
            ${{ steps.apt.outputs.os }}
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          scripts/ci_apt.sh start
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      # Also after a failed or timed-out install, so the next run continues
      # from what this one downloaded.
      - name: Check for new apt packages
        id: apt-changed
        if: ${{ always() }}
        run: scripts/ci_apt.sh changed
      - name: Save the apt packages
        if: ${{ always() && steps.apt-changed.outputs.changed == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt.outputs.key }}
      - run: npm ci --ignore-scripts
        working-directory: bridge
      - name: Build bridge
        run: npm run build
        working-directory: bridge
      - name: Test bridge
        run: npm test -- --test-timeout=30000
        timeout-minutes: 3
        working-directory: bridge
      - run: docker build -t eufy-viewer-bridge:test ./bridge
      - run: docker run --rm --network none -e EUFY_BRIDGE_TOKEN=00000000000000000000000000000000 -v "${{ github.workspace }}/scripts/container-smoke.mjs:/tmp/smoke.mjs:ro" --entrypoint node eufy-viewer-bridge:test /tmp/smoke.mjs
      - run: docker run --rm --network none -v "${{ github.workspace }}/scripts/container-media-smoke.mjs:/tmp/media-smoke.mjs:ro" --entrypoint node eufy-viewer-bridge:test /tmp/media-smoke.mjs
  card:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The Ubuntu mirror is sometimes very slow, so apt packages come from
      # earlier runs where possible, see scripts/ci_apt.sh.
      - name: Key the apt package cache
        id: apt
        run: scripts/ci_apt.sh keys card
      - name: Restore the apt packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt.outputs.key }}
          restore-keys: |
            ${{ steps.apt.outputs.image }}
            ${{ steps.apt.outputs.os }}
      - name: Install ffmpeg and coturn
        timeout-minutes: 8
        run: |
          scripts/ci_apt.sh start
          sudo apt-get update
          sudo apt-get install -y ffmpeg coturn
      - run: npm ci --ignore-scripts
        working-directory: bridge
      - name: Install verified go2rtc for real WebRTC tests
        run: |
          curl --fail --location --retry 3 https://github.com/AlexxIT/go2rtc/releases/download/v1.9.14/go2rtc_linux_amd64 -o "$RUNNER_TEMP/go2rtc"
          echo "32d616af226bd731678ffde328b94cfb94e30339bfefc469cfb76323144615a6  $RUNNER_TEMP/go2rtc" | sha256sum --check
          chmod +x "$RUNNER_TEMP/go2rtc"
          echo "GO2RTC_BINARY=$RUNNER_TEMP/go2rtc" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 8
        working-directory: frontend
      # Also after a failed or timed-out install, so the next run continues
      # from what this one downloaded.
      - name: Check for new apt packages
        id: apt-changed
        if: ${{ always() }}
        run: scripts/ci_apt.sh changed
      - name: Save the apt packages
        if: ${{ always() && steps.apt-changed.outputs.changed == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt.outputs.key }}
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- custom_components/eufy_viewer/frontend
      - run: npm test
        working-directory: frontend
  release-package:
    needs: [dependency-security, home-assistant-checks, release-checks, home-assistant, app-package, bridge, card]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and inspect integration, bridge and source archives
        id: bundle
        run: python3 scripts/release.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  ci:
    if: ${{ always() }}
    needs: [changes, dependency-security, home-assistant-checks, release-checks, home-assistant, app-package, bridge, card, release-package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJson(needs) }}
          # Only these jobs may be skipped, and only for a documentation-only change.
          SKIPPABLE: ${{ needs.changes.outputs.docs_only == 'true' && 'home-assistant app-package bridge card release-package' || '' }}
        run: python3 -c 'import json,os; skip=os.environ["SKIPPABLE"].split(); assert all(j["result"] == "success" or (n in skip and j["result"] == "skipped") for n, j in json.loads(os.environ["RESULTS"]).items())'
