name: Dependency security
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  audit:
    name: npm / ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: bridge
            directory: bridge
          - component: frontend
            directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Audit all locked dependencies without installing packages
        working-directory: ${{ matrix.directory }}
        timeout-minutes: 3
        run: npm audit --package-lock-only --ignore-scripts --include=dev --include=optional --include=peer --json > npm-audit.json
      - name: Keep the audit report even when vulnerabilities are found
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ matrix.component }}
          path: ${{ matrix.directory }}/npm-audit.json
          if-no-files-found: error
          retention-days: 14
  store-folders:
    # The store folders ha_app and ha_app_beta change only in a release PR or
    # a beta cut, so an advisory there must not block other pull requests. A
    # called workflow sees its caller's github context, so Validate and Release
    # runs skip these steps and only the daily schedule and a direct dispatch
    # of this workflow audit the folders. Renaming this workflow disables this
    # audit. The conditions sit on the steps so that the skipped job still
    # succeeds for the ci check.
    name: npm / store folders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STANDALONE: ${{ github.workflow == 'Dependency security' }}
    steps:
      - if: ${{ env.STANDALONE == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: ${{ env.STANDALONE == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Audit the stable store folder without installing packages
        if: ${{ env.STANDALONE == 'true' }}
        working-directory: ha_app
        timeout-minutes: 3
        run: npm audit --package-lock-only --ignore-scripts --include=dev --include=optional --include=peer --json > npm-audit.json
      - name: Audit the beta store folder without installing packages
        id: beta
        if: ${{ always() && env.STANDALONE == 'true' && hashFiles('ha_app_beta/package-lock.json') != '' }}
        working-directory: ha_app_beta
        timeout-minutes: 3
        run: npm audit --package-lock-only --ignore-scripts --include=dev --include=optional --include=peer --json > npm-audit.json
      - name: Keep the stable audit report even when vulnerabilities are found
        if: ${{ always() && env.STANDALONE == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-ha-app
          path: ha_app/npm-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep the beta audit report even when vulnerabilities are found
        if: ${{ always() && steps.beta.outcome != 'skipped' && env.STANDALONE == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-ha-app-beta
          path: ha_app_beta/npm-audit.json
          if-no-files-found: error
          retention-days: 14
  python:
    name: python / uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          # uv audit and its JSON output are preview features. An exact uv
          # version keeps the audit result and report format stable. This
          # setup-uv commit has no known checksum for it, so the checksum of
          # uv-x86_64-unknown-linux-gnu.tar.gz from the uv release is pinned.
          # 0.13.4 is the first uv without the emSign root of
          # GHSA-hq85-5cpj-mr62, which the audit accepts only for uv.lock.
          version: '0.13.4'
          checksum: '2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f'
          enable-cache: false
      - name: Audit all locked Python packages without installing them
        timeout-minutes: 3
        # Exit status 1 means findings or a user error such as a missing
        # lockfile. The next step accepts only a complete report. Any other
        # exit status stops here.
        run: |
          status=0
          uv audit --frozen --preview-features audit-command,json-output --output-format json > uv-audit.json || status=$?
          test "$status" -le 1
      - name: Accept only advisories of versions that homeassistant pins exactly
        timeout-minutes: 1
        run: python3 scripts/check_uv_audit.py uv-audit.json
      - name: Keep the audit report even when vulnerabilities are found
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-python
          path: uv-audit.json
          if-no-files-found: error
          retention-days: 14
